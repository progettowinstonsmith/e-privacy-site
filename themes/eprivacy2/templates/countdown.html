{% if LIVE_AT %}
<h5 class="sidebar-title">IN DIRETTA ALLE ORE {{LIVE_AT}}</h5>
<div class="sidebar-time-counter">
    <a href="{{LIVE_URL}}" alt="Live"><img src="./images/logo/live.png"/></a>
</div>
{% else %}
{% if NOW_LIVE %}
<h5 class="sidebar-title">IN DIRETTA ADESSO</h5>
<div class="sidebar-time-counter">
    <a href="{{LIVE_URL}}" alt="Live"><img src="./images/logo/nowlive.png"/></a>
</div>
{% else %}
{% if COUNTDOWN %}
<div class="ep-countdown-card" id="ep-countdown-box">
    <div class="ep-countdown-title">PROSSIMO EVENTO</div>
    <div class="ep-countdown-num" id="ep-countdown-days">-</div>
    <div class="ep-countdown-label" id="ep-countdown-text">giorni all'evento</div>
</div>
<style>
.ep-countdown-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 14px 10px;
    margin: 0 0 16px 0;
    text-align: center;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
}
.ep-countdown-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 4px;
}
.ep-countdown-num {
    font-size: 2.8rem;
    font-weight: 800;
    line-height: 1;
    color: #38bdf8;
    font-family: "Oswald", "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: -0.02em;
}
.ep-countdown-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #cbd5e1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
}
</style>
<script type="text/javascript">
(function() {
    function updateCountdown() {
        var rawTarget = "{{ EVENT_TIME }}";
        if (!rawTarget) return;
        var parts = rawTarget.replace(/-/g, "/").split(/[/ :]/);
        if (parts.length < 3) return;
        var targetDate = new Date(parts[0], parts[1] - 1, parts[2], parts[3] || 9, parts[4] || 30);
        var now = new Date();
        var targetMidnight = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        var nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var diffMs = targetMidnight.getTime() - nowMidnight.getTime();
        var diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

        var numEl = document.getElementById("ep-countdown-days");
        var textEl = document.getElementById("ep-countdown-text");
        if (!numEl || !textEl) return;

        if (diffDays > 1) {
            numEl.textContent = diffDays;
            textEl.textContent = "giorni all'evento";
        } else if (diffDays === 1) {
            numEl.textContent = "1";
            textEl.textContent = "giorno all'evento";
        } else if (diffDays === 0 || diffDays === -1) {
            numEl.textContent = "OGGI";
            numEl.style.fontSize = "2.2rem";
            textEl.textContent = "convegno in corso!";
        } else {
            numEl.textContent = "✓";
            textEl.textContent = "evento concluso";
        }
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", updateCountdown);
    } else {
        updateCountdown();
    }
})();
</script>
{% endif %}
{% endif %}
{% endif %}
